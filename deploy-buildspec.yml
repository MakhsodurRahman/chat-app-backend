version: 0.2

phases:
  build:
    commands:
      - echo Triggering local Docker build on EC2...
      - |
        aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "Building and running Docker locally" \
          --parameters "commands=[
            \"mkdir -p /home/ubuntu/app\",
            \"/usr/local/bin/aws s3 sync s3://$ARTIFACT_BUCKET/latest-source/ /home/ubuntu/app/\",
            \"cd /home/ubuntu/app\",
            \"docker build -t chat-app .\",
            \"docker stop chat-app || true\",
            \"docker rm chat-app || true\",
            \"docker run -d --name chat-app -p 8080:8080 chat-app\"
          ]"
