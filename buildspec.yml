version: 0.2

# =============================================================
# buildspec.yml — Spring Boot CI/CD with AWS CodeDeploy
#
# Flow:
#   1. Build JAR with Maven
#   2. Build & push Docker image to ECR
#   3. Generate appspec.yml + deploy script as artifact
#   4. CodePipeline passes artifact to CodeDeploy
#   5. CodeDeploy agent on EC2 runs deploy script
#
# Place this file at the ROOT of your Spring Boot GitHub repo.
# =============================================================

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "=== Install Phase ==="
      - java -version

  pre_build:
    commands:
      - echo "=== Pre-Build: Logging in to ECR ==="
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "Image tag is $IMAGE_TAG"

  build:
    commands:
      - echo "=== Build Phase: Docker (Maven runs inside multi-stage Dockerfile) ==="
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "=== Post-Build: Pushing to ECR ==="
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Push complete."

      # ── Generate CodeDeploy artifact ───────────────────────────
      # appspec.yml tells CodeDeploy what to do on EC2
      - echo "=== Generating CodeDeploy deployment bundle ==="
      - mkdir -p codedeploy/scripts

      - |
        cat > codedeploy/appspec.yml << 'EOF'
        version: 0.0
        os: linux
        hooks:
          AfterInstall:
            - location: scripts/deploy.sh
              timeout: 300
              runas: root
        EOF

      # deploy.sh runs on EC2 — ECR URI is baked in at build time
      - |
        cat > codedeploy/scripts/deploy.sh << DEPLOY
        #!/bin/bash
        set -e
        REGION="${AWS_DEFAULT_REGION}"
        IMAGE="${REPOSITORY_URI}:latest"

        echo "--- Logging in to ECR ---"
        aws ecr get-login-password --region \$REGION | docker login --username AWS --password-stdin "${REPOSITORY_URI}"

        echo "--- Pulling latest image ---"
        docker pull \$IMAGE

        echo "--- Stopping old container (if any) ---"
        docker stop spring-app || true
        docker rm   spring-app || true

        echo "--- Starting new container ---"
        docker run -d \
          --name spring-app \
          -p 8080:8080 \
          --restart unless-stopped \
          \$IMAGE

        echo "--- Deployment complete! ---"
        docker ps | grep spring-app
        DEPLOY

      - chmod +x codedeploy/scripts/deploy.sh
      - echo "=== Bundle ready ==="

# The build_output artifact passed to CodeDeploy must contain:
#   appspec.yml  (at root)
#   scripts/deploy.sh
artifacts:
  base-directory: codedeploy
  files:
    - appspec.yml
    - scripts/deploy.sh
