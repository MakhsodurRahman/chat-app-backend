version: 0.2

# ============================================================
# buildspec.yml — Spring Boot CI/CD via ECR + SSM
# Place this file in the ROOT of your GitHub repo.
# ============================================================

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "=== Install Phase ==="
      - java -version
      - mvn -version || echo "Maven not found, will use wrapper"

  pre_build:
    commands:
      - echo "=== Pre-Build Phase ==="

      # Log in to ECR
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI

      # Set image tag from git commit hash (fallback: 'latest')
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "Building image tag: $IMAGE_TAG"

      # Debug: show repo structure
      - echo "=== Repository Files ==="
      - ls -la

  build:
    commands:
      - echo "=== Build Phase started at $(date) ==="

      # Build Spring Boot JAR (use Maven Wrapper if present)
      - |
        if [ -f "./mvnw" ]; then
          echo "Using Maven Wrapper (mvnw)"
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests --batch-mode
        else
          echo "Using system Maven"
          mvn clean package -DskipTests --batch-mode
        fi

      - echo "=== JAR built. Building Docker image... ==="
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
      - echo "Docker image tagged as $IMAGE_TAG"

  post_build:
    commands:
      - echo "=== Post-Build Phase ==="

      # Push both tags to ECR
      - echo "Pushing images to ECR..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Push complete."

      # Deploy to EC2 via SSM Run Command (targets EC2 by Name tag)
      - echo "=== Triggering deployment on EC2 via SSM ==="
      - |
        COMMAND_ID=$(aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "Key=tag:Name,Values=${INSTANCE_NAME}" \
          --parameters "commands=[
            \"aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${REPOSITORY_URI}\",
            \"docker pull ${REPOSITORY_URI}:latest\",
            \"docker stop spring-app || true\",
            \"docker rm spring-app || true\",
            \"docker run -d --name spring-app -p 8080:8080 --restart unless-stopped ${REPOSITORY_URI}:latest\"
          ]" \
          --region $AWS_DEFAULT_REGION \
          --query "Command.CommandId" \
          --output text)

        echo "SSM Command ID: $COMMAND_ID"

        # Wait up to 90 seconds for SSM command to complete
        echo "Waiting for deployment to complete..."
        for i in $(seq 1 9); do
          sleep 10
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${INSTANCE_NAME}" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)" \
            --query "Status" \
            --output text 2>/dev/null || echo "Pending")
          echo "Attempt $i: Status = $STATUS"
          if [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment succeeded!"
            break
          elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
            echo "❌ Deployment failed with status: $STATUS"
            exit 1
          fi
        done

      - echo "=== Pipeline complete ==="
